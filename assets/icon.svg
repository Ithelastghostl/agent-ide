<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#533afd"/>
      <stop offset="1" stop-color="#ac4bff"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e0f2"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe0ff"/>
      <stop offset="1" stop-color="#1fa8e0"/>
    </linearGradient>
  </defs>

  <!-- Icon tile: inset ~20% of the canvas to match the macOS icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>

  <!-- faint circuit accents -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M 190 312 H 278 L 326 264"/>
    <path d="M 834 712 H 746 L 698 760"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.22">
    <circle cx="190" cy="312" r="14"/>
    <circle cx="834" cy="712" r="14"/>
  </g>

  <!-- antenna -->
  <rect x="498" y="272" width="28" height="110" rx="14" fill="#d9e0f2"/>
  <circle cx="512" cy="252" r="46" fill="#ffd34d"/>
  <circle cx="497" cy="237" r="14" fill="#ffffff" fill-opacity="0.7"/>

  <!-- ears -->
  <rect x="240" y="478" width="70" height="160" rx="35" fill="#d9e0f2"/>
  <rect x="714" y="478" width="70" height="160" rx="35" fill="#d9e0f2"/>

  <!-- head -->
  <rect x="292" y="370" width="440" height="380" rx="104" fill="url(#head)"/>

  <!-- visor -->
  <rect x="342" y="432" width="340" height="180" rx="90" fill="#232946"/>

  <!-- eyes -->
  <circle cx="432" cy="522" r="52" fill="url(#eye)"/>
  <circle cx="592" cy="522" r="52" fill="url(#eye)"/>
  <circle cx="414" cy="504" r="16" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="574" cy="504" r="16" fill="#ffffff" fill-opacity="0.85"/>

  <!-- mouth -->
  <rect x="442" y="656" width="140" height="30" rx="15" fill="#232946"/>
</svg>
