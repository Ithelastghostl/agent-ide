<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- S-CSP: strict content security policy for the renderer. Scripts only from
         our own bundle (no inline/eval); styles allow inline for dynamic element
         styling; images allow data: URIs; no network egress (connect-src 'self');
         frame-src 'self' permits ONLY the F15 report srcdoc iframe (which is
         additionally sandboxed to a null origin), object/base are denied. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Nacho's IDE</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
